<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration originale : tajine en terre cuite fumant -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#55622F"/>
      <stop offset="1" stop-color="#2E3520"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E3A22"/>
      <stop offset=".45" stop-color="#C8643F"/>
      <stop offset="1" stop-color="#8E3A22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#glow)"/>

  <!-- Vapeur -->
  <g fill="none" stroke="#FBF7EF" stroke-width="6" stroke-linecap="round" opacity=".45">
    <path d="M360 170c-30-40 30-60 0-100"/>
    <path d="M410 150c-30-40 30-60 0-100"/>
    <path d="M460 175c-30-40 30-60 0-100"/>
  </g>

  <!-- Plat -->
  <ellipse cx="400" cy="620" rx="300" ry="70" fill="#6E2E1C"/>
  <ellipse cx="400" cy="600" rx="300" ry="70" fill="#A8462A"/>
  <ellipse cx="400" cy="590" rx="250" ry="48" fill="#8E3A22"/>

  <!-- Couvercle conique -->
  <path d="M170 590C230 470 330 300 380 230h40c50 70 150 240 210 360z" fill="url(#lid)"/>
  <path d="M220 540c120 30 240 30 360 0" stroke="#E0B252" stroke-width="6" fill="none"/>
  <path d="M270 450c90 22 170 22 260 0" stroke="#E0B252" stroke-width="5" fill="none"/>
  <path d="M320 360c50 14 110 14 160 0" stroke="#E0B252" stroke-width="4" fill="none"/>
  <g fill="#E0B252">
    <circle cx="300" cy="500" r="7"/><circle cx="360" cy="508" r="7"/><circle cx="440" cy="508" r="7"/><circle cx="500" cy="500" r="7"/>
    <circle cx="340" cy="410" r="6"/><circle cx="400" cy="415" r="6"/><circle cx="460" cy="410" r="6"/>
  </g>
  <!-- Bouton du couvercle -->
  <ellipse cx="400" cy="228" rx="34" ry="12" fill="#6E2E1C"/>
  <circle cx="400" cy="206" r="22" fill="#C8643F"/>
  <path d="M330 300c-30 80-70 160-110 250" stroke="#FBF7EF" stroke-width="10" opacity=".18" fill="none" stroke-linecap="round"/>
</svg>
