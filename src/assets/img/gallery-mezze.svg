<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration originale : mezze vus du dessus sur une nappe -->
  <defs>
    <pattern id="cloth" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#2E3520"/>
      <path d="M40 0v80M0 40h80" stroke="#3A4228" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#cloth)"/>

  <!-- Houmous + filet d'huile + paprika -->
  <circle cx="290" cy="300" r="170" fill="#F3EADA"/>
  <circle cx="290" cy="300" r="140" fill="#E8CFA0"/>
  <path d="M200 300c30-50 150-50 180 0-30 50-150 50-180 0z" fill="none" stroke="#C9A24A" stroke-width="10"/>
  <circle cx="290" cy="300" r="26" fill="#B8862A"/>
  <g fill="#A8462A"><circle cx="250" cy="250" r="5"/><circle cx="330" cy="350" r="5"/><circle cx="340" cy="260" r="4"/><circle cx="240" cy="345" r="4"/></g>

  <!-- Taboulé -->
  <circle cx="590" cy="250" r="120" fill="#F3EADA"/>
  <circle cx="590" cy="250" r="96" fill="#7A8B3A"/>
  <g fill="#A9B57A">
    <circle cx="560" cy="220" r="8"/><circle cx="610" cy="200" r="7"/><circle cx="630" cy="260" r="8"/>
    <circle cx="570" cy="290" r="7"/><circle cx="545" cy="255" r="6"/><circle cx="600" cy="310" r="6"/>
  </g>
  <g fill="#C8643F"><circle cx="590" cy="240" r="9"/><circle cx="625" cy="225" r="7"/><circle cx="560" cy="270" r="7"/></g>

  <!-- Olives -->
  <circle cx="610" cy="560" r="100" fill="#F3EADA"/>
  <circle cx="610" cy="560" r="78" fill="#E7DAC2"/>
  <g fill="#2E3520">
    <ellipse cx="580" cy="540" rx="16" ry="21"/><ellipse cx="620" cy="525" rx="16" ry="21" transform="rotate(20 620 525)"/>
    <ellipse cx="645" cy="570" rx="16" ry="21"/><ellipse cx="600" cy="590" rx="16" ry="21" transform="rotate(-25 600 590)"/>
  </g>
  <g fill="#7A8B3A"><ellipse cx="560" cy="580" rx="15" ry="20"/><ellipse cx="640" cy="610" rx="15" ry="20" transform="rotate(30 640 610)"/></g>

  <!-- Moutabal rosé -->
  <circle cx="250" cy="610" r="105" fill="#F3EADA"/>
  <circle cx="250" cy="610" r="82" fill="#C88E6A"/>
  <path d="M195 610c20-30 90-30 110 0" stroke="#E0B252" stroke-width="7" fill="none"/>
  <g fill="#55622F"><circle cx="235" cy="630" r="6"/><circle cx="270" cy="600" r="6"/></g>

  <!-- Pain pita -->
  <g fill="#E0B252" stroke="#B8862A" stroke-width="4">
    <path d="M430 430l90 30-60 70z"/>
    <path d="M410 480l60 80-90 10z"/>
  </g>
</svg>
