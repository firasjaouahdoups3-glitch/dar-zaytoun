<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration originale : bouteille d'huile d'olive, coupelle et branche -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EADA"/>
      <stop offset="1" stop-color="#E7DAC2"/>
    </linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C8A2E"/>
      <stop offset=".5" stop-color="#C9B746"/>
      <stop offset="1" stop-color="#7A7A26"/>
    </linearGradient>
    <path id="l" d="M0 0C16-11 46-11 70 0 46 11 16 11 0 0Z"/>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect y="600" width="800" height="200" fill="#C8643F"/>
  <rect y="600" width="800" height="14" fill="#A8462A"/>

  <!-- Bouteille -->
  <path d="M340 160h50v70c0 30 70 60 70 140v230c0 14-10 20-24 20H294c-14 0-24-6-24-20V370c0-80 70-110 70-140z" fill="url(#oil)" opacity=".92"/>
  <path d="M296 380h138v160H296z" fill="#FBF7EF"/>
  <path d="M296 380h138" stroke="#A8462A" stroke-width="5"/>
  <path d="M296 540h138" stroke="#A8462A" stroke-width="5"/>
  <circle cx="365" cy="445" r="26" fill="none" stroke="#55622F" stroke-width="4"/>
  <use href="#l" transform="translate(345 450) rotate(-30) scale(.55)" fill="#55622F"/>
  <rect x="336" y="130" width="58" height="36" rx="6" fill="#2E3520"/>
  <path d="M300 300c-10 40-10 150 0 230" stroke="#FBF7EF" stroke-width="8" opacity=".35" fill="none" stroke-linecap="round"/>

  <!-- Coupelle d'huile -->
  <ellipse cx="560" cy="610" rx="110" ry="30" fill="#FBF7EF"/>
  <ellipse cx="560" cy="604" rx="84" ry="18" fill="#C9B746"/>
  <ellipse cx="540" cy="600" rx="22" ry="5" fill="#F2E39A" opacity=".8"/>

  <!-- Branche avec olives -->
  <path d="M800 140C700 170 620 230 540 330" stroke="#5A4330" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g fill="#55622F">
    <use href="#l" transform="translate(760 150) rotate(150)"/>
    <use href="#l" transform="translate(720 166) rotate(-160)"/>
    <use href="#l" transform="translate(680 190) rotate(140)"/>
    <use href="#l" transform="translate(640 220) rotate(-150)"/>
    <use href="#l" transform="translate(600 260) rotate(130)"/>
    <use href="#l" transform="translate(570 296) rotate(-140)"/>
  </g>
  <g fill="#2E3520">
    <ellipse cx="660" cy="232" rx="13" ry="17"/>
    <ellipse cx="684" cy="226" rx="12" ry="16"/>
    <ellipse cx="590" cy="320" rx="13" ry="17"/>
  </g>
  <g fill="#7A8B3A"><ellipse cx="470" cy="640" rx="14" ry="18" transform="rotate(70 470 640)"/><ellipse cx="660" cy="660" rx="14" ry="18" transform="rotate(-60 660 660)"/></g>
</svg>
